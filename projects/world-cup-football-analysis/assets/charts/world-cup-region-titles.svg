<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="World Cup titles by region">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">World Cup Titles by Region</text>
  <text x="60" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4b5563">Europe leads total titles, while South America remains highly concentrated and powerful.</text>
  <g transform="translate(90 160)">
    <circle cx="260" cy="220" r="170" fill="#2563eb"/>
    <text x="260" y="210" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="54" font-weight="700" fill="#ffffff">12</text>
    <text x="260" y="250" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="24" fill="#dbeafe">Europe</text>
  </g>
  <g transform="translate(585 180)">
    <circle cx="240" cy="200" r="150" fill="#16a34a"/>
    <text x="240" y="192" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="50" font-weight="700" fill="#ffffff">10</text>
    <text x="240" y="232" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" font-size="24" fill="#dcfce7">South America</text>
  </g>
  <text x="60" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7280">Counts use tournament winners from 1930 through 2022.</text>
</svg>
