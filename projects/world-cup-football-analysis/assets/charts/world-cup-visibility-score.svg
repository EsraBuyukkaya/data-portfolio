<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="World Cup visibility score bar chart">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="60" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">World Cup Visibility Score</text>
  <text x="60" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4b5563">A proxy for popularity based on titles, finals, and appearances.</text>
  <text x="60" y="137" font-family="Consolas, monospace" font-size="16" fill="#6b7280">score = titles * 5 + finals * 3 + appearances</text>
  <line x1="250" y1="500" x2="1000" y2="500" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#111827">
    <text x="64" y="191">Brazil</text>
    <rect x="250" y="157" width="680" height="40" rx="5" fill="#059669"/>
    <text x="945" y="184" font-weight="700">68</text>
    <text x="64" y="246">Germany</text>
    <rect x="250" y="212" width="640" height="40" rx="5" fill="#10b981"/>
    <text x="905" y="239" font-weight="700">64</text>
    <text x="64" y="301">Italy</text>
    <rect x="250" y="267" width="560" height="40" rx="5" fill="#34d399"/>
    <text x="825" y="294" font-weight="700">56</text>
    <text x="64" y="356">Argentina</text>
    <rect x="250" y="322" width="510" height="40" rx="5" fill="#6ee7b7"/>
    <text x="775" y="349" font-weight="700">51</text>
    <text x="64" y="411">France</text>
    <rect x="250" y="377" width="380" height="40" rx="5" fill="#a7f3d0"/>
    <text x="645" y="404" font-weight="700">38</text>
    <text x="64" y="466">Uruguay</text>
    <rect x="250" y="432" width="300" height="40" rx="5" fill="#d1fae5"/>
    <text x="565" y="459" font-weight="700">30</text>
  </g>
  <text x="60" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6b7280">Interpretation: This is not a fan survey. It is an honest, measurable proxy for tournament visibility.</text>
</svg>
